version: '3.3'

services:
  api:
    image: node:20
    container_name: api
    working_dir: /build
    command: node bin/server.js
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: always
  sheduler:
    image: node:20
    container_name: sheduler
    working_dir: /build
    command: node ace.js scheduler:run
    ports:
      - "8081:8081"
    env_file:
      - .env
    restart: always

networks:
  shared_network:
    driver: bridge