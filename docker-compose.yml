version: '3.3'

services:
  api:
    image: node:20
    container_name: api
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: always
  sheduler:
    image: node:20
    container_name: sheduler
    env_file:
      - .env
    restart: always

networks:
  shared_network:
    driver: bridge