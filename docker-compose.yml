networks:
  mongo_default:
    external: true

services:
  api:
    build: .
    image: api-image
    container_name: api
    ports:
      - '3030:3030'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - /docker-volumes/secrets:/app/secrets
    restart: always 
    networks:
      - mongo_default

  scheduler:
    build: .
    image: api-image
    container_name: scheduler
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - /docker-volumes/secrets:/app/secrets
    restart: always
    networks:
      - mongo_default
    command: ["node", "ace", "scheduler:run"]
