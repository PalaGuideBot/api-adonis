networks:
  mongo_default:
    external: true

services:
  api:
    build: .
    container_name: api
    ports:
      - '3030:3030'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - /docker-volumes/secrets:/app/secrets
    restart: always 
    networks:
      - mongo_default